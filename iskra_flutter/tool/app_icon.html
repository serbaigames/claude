<!doctype html><html><body style="margin:0;background:#000">
<!-- Иконка «Искры»: открыть в браузере (?k=0.78 — вариант maskable с запасом по краям), снять холст 1024×1024. -->
<canvas id="c" width="1024" height="1024"></canvas>
<script>
const P = new URLSearchParams(location.search), K = +(P.get('k') || 1); // k<1 — меньше искра (maskable)
const c = document.getElementById('c'), x = c.getContext('2d'), S = 1024, cx = S / 2, cy = S / 2, TAU = Math.PI * 2;
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const radial = (X, Y, r, st) => { const g = x.createRadialGradient(X, Y, 0, X, Y, r); st.forEach(([o, col]) => g.addColorStop(o, col)); x.fillStyle = g; x.fillRect(X - r, Y - r, 2 * r, 2 * r); };
// фон: глубокий космос
let g = x.createRadialGradient(cx, cy * 0.9, 0, cx, cy, S * 0.75);
g.addColorStop(0, '#2a1b4d'); g.addColorStop(0.55, '#140e2a'); g.addColorStop(1, '#07050f');
x.fillStyle = g; x.fillRect(0, 0, S, S);
x.globalCompositeOperation = 'lighter';
radial(S * 0.22, S * 0.25, S * 0.4, [[0, 'rgba(120,70,200,0.18)'], [1, 'rgba(120,70,200,0)']]);
radial(S * 0.8, S * 0.78, S * 0.42, [[0, 'rgba(60,90,200,0.14)'], [1, 'rgba(60,90,200,0)']]);
for (let i = 0; i < 160; i++) { const r = rnd() ** 3 * 2.6 + 0.6, a = 0.25 + rnd() * 0.6; x.fillStyle = `rgba(230,225,255,${a})`; x.beginPath(); x.arc(rnd() * S, rnd() * S, r, 0, TAU); x.fill(); }
x.globalCompositeOperation = 'source-over';
const R = S * 0.2 * K;
// соты мира за искрой
const hex = (X, Y, r) => { x.beginPath(); for (let i = 0; i < 6; i++) { const a = Math.PI / 6 + i * Math.PI / 3; x.lineTo(X + r * Math.cos(a), Y + r * Math.sin(a)); } x.closePath(); };
x.lineWidth = S * 0.004;
const hr = R * 0.82, hw = Math.sqrt(3) * hr, cells = [];
for (let q = -3; q <= 3; q++) for (let rr = -3; rr <= 3; rr++) { const X = cx + (q + (rr & 1) * 0.5) * hw, Y = cy + rr * hr * 1.5; if (Math.hypot(X - cx, Y - cy) < hw * 2.3) cells.push([X, Y]); }
for (const [X, Y] of cells) {
  const d = Math.hypot(X - cx, Y - cy) / (hw * 2.3);
  hex(X, Y, hr * 0.96);
  x.fillStyle = `rgba(242,180,65,${0.07 * Math.max(0, 1 - d)})`; x.fill();
  x.strokeStyle = `rgba(242,180,65,${0.34 * Math.max(0, 1 - d * 0.9)})`; x.stroke();
}
x.globalCompositeOperation = 'lighter';
// сияние
radial(cx, cy, R * 4.2, [[0, 'rgba(255,170,60,0.42)'], [0.3, 'rgba(242,140,40,0.16)'], [1, 'rgba(242,120,40,0)']]);
radial(cx, cy, R * 2.1, [[0, 'rgba(255,225,150,0.75)'], [0.55, 'rgba(255,170,70,0.2)'], [1, 'rgba(255,150,50,0)']]);
// корональные лучи
for (let i = 0; i < 64; i++) {
  const a = rnd() * TAU, l = R * (1.25 + rnd() * rnd() * 1.4), w = 0.012 + rnd() * 0.02;
  const gr = x.createLinearGradient(cx, cy, cx + Math.cos(a) * l, cy + Math.sin(a) * l);
  gr.addColorStop(0.55, `rgba(255,210,130,${0.25 + rnd() * 0.25})`); gr.addColorStop(1, 'rgba(255,160,60,0)');
  x.fillStyle = gr; x.beginPath(); x.moveTo(cx, cy);
  x.lineTo(cx + Math.cos(a - w) * l * 0.6, cy + Math.sin(a - w) * l * 0.6); x.lineTo(cx + Math.cos(a) * l, cy + Math.sin(a) * l);
  x.lineTo(cx + Math.cos(a + w) * l * 0.6, cy + Math.sin(a + w) * l * 0.6); x.closePath(); x.fill();
}
// протуберанцы
for (const [a0, span, h] of [[-2.3, 0.75, 0.55], [0.5, 0.6, 0.42], [2.2, 0.5, 0.34]]) {
  for (let k = 0; k < 3; k++) {
    const a1 = a0 + span * (0.1 * k), a2 = a0 + span * (1 - 0.08 * k), hh = R * (1 + h * (1 - k * 0.2));
    const p1 = [cx + Math.cos(a1) * R * 0.97, cy + Math.sin(a1) * R * 0.97], p2 = [cx + Math.cos(a2) * R * 0.97, cy + Math.sin(a2) * R * 0.97];
    const am = (a1 + a2) / 2, cp = [cx + Math.cos(am) * hh * 1.35, cy + Math.sin(am) * hh * 1.35];
    x.strokeStyle = `rgba(255,${150 + k * 30},${70 + k * 30},${0.55 - k * 0.12})`; x.lineWidth = R * (0.07 - k * 0.018);
    x.shadowColor = 'rgba(255,140,50,0.9)'; x.shadowBlur = R * 0.15;
    x.beginPath(); x.moveTo(...p1); x.quadraticCurveTo(...cp, ...p2); x.stroke();
  }
}
x.shadowBlur = 0;
x.globalCompositeOperation = 'source-over';
// орбиты и ядра искры
const orbits = [[1.62, 0.36, -0.42, 2.45, '#9fd4ff'], [1.9, 0.3, 0.38, 0.55, '#ffd36b'], [1.42, 0.42, 1.25, 0.25, '#c9a0ff']];
const orb = [];
for (const [rr, flat, tilt, ph, col] of orbits) {
  const ax = R * rr, by = ax * flat;
  const pt = (t) => { const px = Math.cos(t) * ax, py = Math.sin(t) * by; return [cx + px * Math.cos(tilt) - py * Math.sin(tilt), cy + px * Math.sin(tilt) + py * Math.cos(tilt)]; };
  orb.push([pt, ph, col]);
}
const line = (pt, front) => { x.strokeStyle = 'rgba(255,220,170,0.16)'; x.lineWidth = S * 0.0025; x.beginPath();
  for (let t = front ? 0 : Math.PI; t <= (front ? Math.PI : TAU) + 0.01; t += 0.04) {
    const q = pt(t); if (front && Math.hypot(q[0] - cx, q[1] - cy) < R * 1.03) { x.stroke(); x.beginPath(); continue; } x.lineTo(...q); }
  x.stroke(); };
x.globalCompositeOperation = 'lighter';
for (const [pt] of orb) line(pt, false);
x.globalCompositeOperation = 'source-over';
// тело звезды
g = x.createRadialGradient(cx - R * 0.2, cy - R * 0.22, R * 0.04, cx, cy, R);
g.addColorStop(0, '#fffdf0'); g.addColorStop(0.32, '#ffeaa8'); g.addColorStop(0.7, '#ffbd4a'); g.addColorStop(1, '#ec7420');
x.fillStyle = g; x.beginPath(); x.arc(cx, cy, R, 0, TAU); x.fill();
// грануляция
x.save(); x.beginPath(); x.arc(cx, cy, R, 0, TAU); x.clip();
x.globalCompositeOperation = 'soft-light';
for (let i = 0; i < 900; i++) {
  const a = rnd() * TAU, d = Math.sqrt(rnd()) * R, r = R * (0.03 + rnd() * 0.07);
  const X = cx + Math.cos(a) * d, Y = cy + Math.sin(a) * d;
  radial(X, Y, r, [[0, rnd() < 0.5 ? 'rgba(255,255,230,0.55)' : 'rgba(150,50,0,0.5)'], [1, 'rgba(0,0,0,0)']]);
}
x.globalCompositeOperation = 'source-over';
radial(cx, cy, R, [[0.55, 'rgba(160,50,0,0)'], [0.9, 'rgba(160,50,0,0.3)'], [0.995, 'rgba(110,25,0,0.6)'], [1, 'rgba(110,25,0,0)']]);
x.restore();
x.globalCompositeOperation = 'lighter';
radial(cx - R * 0.1, cy - R * 0.12, R * 0.6, [[0, 'rgba(255,255,240,0.75)'], [1, 'rgba(255,240,200,0)']]);

x.globalCompositeOperation = 'lighter';
for (const [pt, ph, col] of orb) {
  line(pt, true);
  // след
  for (let k = 0; k < 40; k++) { const t = ph - k * 0.022; const [X, Y] = pt(t); radial(X, Y, R * 0.09 * (1 - k / 40), [[0, col + Math.round(140 * (1 - k / 40)).toString(16).padStart(2, '0')], [1, col + '00']]); }
  const [X, Y] = pt(ph);
  radial(X, Y, R * 0.55, [[0, col + '88'], [1, col + '00']]);
  radial(X, Y, R * 0.16, [[0, '#ffffff'], [0.5, col + 'ff'], [1, col + '00']]);
}
// анаморфная вспышка
x.save(); x.translate(cx, cy); x.scale(1, 0.035);
radial(0, 0, R * 3.4, [[0, 'rgba(255,220,170,0.55)'], [1, 'rgba(255,180,120,0)']]); x.restore();
document.title = 'done';
</script></body></html>
