# Релиз Flutter-версии «Искры»: APK для Android и веб-сборка с PHP-сервером.
# Запускается изменением iskra_flutter/RELEASE_NOTES.md в ветке (тег — iskra-v<версия из pubspec.yaml>),
# тегом iskra-v* или вручную из вкладки Actions.
name: iskra-release

on:
  push:
    tags: ['iskra-v*']
    branches: ['claude/project-thread-ioiybu', 'main', 'master']
    paths: ['iskra_flutter/RELEASE_NOTES.md']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза, например iskra-v0.2.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iskra_flutter
    steps:
      - uses: actions/checkout@v4
      - name: Тег релиза
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then t="${{ github.event.inputs.tag }}"
          elif [ "${{ github.ref_type }}" = tag ]; then t="${{ github.ref_name }}"
          else t="iskra-v$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"; fi
          echo "TAG=$t" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "../iskra-${TAG#iskra-v}.apk"
      - name: Веб-сборка с сервером
        run: |
          flutter build web --release --no-web-resources-cdn
          mkdir -p ../web-pkg
          cp -r build/web/. ../web-pkg/
          cp -r server/api server/data ../web-pkg/
          cp server/site.htaccess ../web-pkg/.htaccess
          cd ../web-pkg && zip -qr "../iskra-web-${TAG#iskra-v}.zip" .
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Искра ${{ env.TAG }}
          body_path: iskra_flutter/RELEASE_NOTES.md
          prerelease: true
          files: |
            iskra-*.apk
            iskra-web-*.zip
